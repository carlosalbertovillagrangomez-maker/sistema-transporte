name: Build Android APK

on:
  push:
    branches:
      - main
      - fix/closed-test-2026-10-01
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Install Capacitor wrapper
        run: npm install --no-save --package-lock=false @capacitor/core@8.4.1 @capacitor/android@8.4.1 @capacitor/cli@8.4.1
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TripLogix-Dispatcher-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
