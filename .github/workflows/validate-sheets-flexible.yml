name: Validate flexible Google Sheets import

on:
  push:
    branches: [feature/sheets-flexible-2026-11-12]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit tests for public Sheet gateway
        run: node --test tests/leer-publico.test.js
      - name: Check backend syntax
        run: |
          node --check api/sheets/leer-publico.js
          node --check api/whatsapp/sync.js
      - name: Build app
        run: npm run build
