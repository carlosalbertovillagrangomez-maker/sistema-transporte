name: Corporate roster and automatic planning QA
on:
  push:
    branches: [feature/corporate-roster-auto-planning-2026-11-22]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Corporate weekly schedules and grouping
        run: node --test tests/triplogixCorporateSchedule.test.js tests/triplogixPickupModes.test.js tests/triplogixCarpoolPolicy.test.js tests/triplogixScheduleReview.test.js tests/triplogixFourColumns.test.js tests/triplogixFiveColumns.test.js tests/triplogixSplitHeader.test.js tests/triplogixWeeklyTemplate.test.js tests/triplogixWorkbook.test.js
      - name: API syntax
        run: node --check api/whatsapp/sync.js
      - name: New module static analysis
        run: npx eslint src/TripLogixEnterpriseWorkspace.jsx src/TripLogixCorporatePlanner.jsx src/triplogixCorporateSchedule.js
      - name: Production frontend build
        run: npm run build
