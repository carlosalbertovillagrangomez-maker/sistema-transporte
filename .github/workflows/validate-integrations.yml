name: Validate TripLogix integrations

on:
  push:
    branches:
      - feature/sheets-fastdrivers-whatsapp-2026-11-12
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate WhatsApp serverless JS
        run: node --check api/whatsapp/sync.js
      - name: Build React Vite
        run: npm run build
      - name: Check no Meta service token is in client-side source
        run: |
          if grep -R --include='*.jsx' -E 'WHATSAPP_ACCESS_TOKEN.*=' src | grep -v 'code className'; then
            echo "Unexpected Meta secret assignment in browser code"
            exit 1
          fi
          echo "Secret names only"
