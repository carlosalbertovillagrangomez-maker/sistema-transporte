name: Validate operational planning template

on:
  push:
    branches: [feature/operational-template-2026-11-13]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Test operational workbook parser and existing Sheet gateway
        run: node --test tests/triplogixWorkbook.test.js tests/leer-publico.test.js
      - name: Check backend syntax
        run: |
          node --check api/sheets/leer-publico.js
          node --check api/whatsapp/sync.js
      - name: Build Vite app
        run: npm run build
