name: Validate corporate day-specific meeting points
on:
  push:
    branches: [feature/daily-meeting-points-company-2026-11-25]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Day-specific locations and all historical regressions
        run: node --test tests/triplogixDailyMeetingPoints.test.js tests/triplogixCorporateSchedule.test.js tests/triplogixPickupModes.test.js tests/triplogixCarpoolPolicy.test.js tests/triplogixScheduleReview.test.js tests/triplogixFourColumns.test.js tests/triplogixFiveColumns.test.js tests/triplogixSplitHeader.test.js tests/triplogixWeeklyTemplate.test.js tests/triplogixWorkbook.test.js
      - name: New code static analysis
        run: npx eslint src/TripLogixEnterpriseWorkspace.jsx src/TripLogixCorporatePlanner.jsx src/triplogixCorporateSchedule.js src/triplogixPickupModes.js
      - name: Production build
        run: npm run build
